[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-occupancy-planner"
version = "0.1.0"
description = "Synthetic parking capacity summaries and deterministic zone suggestions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
parking-planner = "parking_planner.cli:main"

[tool.setuptools]
packages = ["parking_planner"]
